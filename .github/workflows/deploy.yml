
name: CI-CD Backend

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: ics2026-backend-api-pi

jobs:

  # 1. Compilacion, pruebas y analisis de calidad
  tests:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configurar Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Instalar SonarScanner para .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Autenticar con SonarQube Cloud para iniciar el analisis
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: sonar-auth

      - name: Iniciar analisis SonarQube
        run: |
          dotnet sonarscanner begin \
            /k:"PabloIbrahim_ICS2026-backend" \
            /o:"pabloibrahim" \
            /d:sonar.token="${{ steps.sonar-auth.outputs.sonar-token }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Compilar solucion
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Ejecutar pruebas unitarias y de integracion con cobertura
        run: |
          dotnet test Dsw2025Tpi.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Renovar autenticacion con SonarQube Cloud para finalizar
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: sonar-auth-end

      - name: Finalizar analisis SonarQube
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ steps.sonar-auth-end.outputs.sonar-token }}"

  # 2. Construccion de imagen Docker
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Construir imagen Docker
        run: docker build -t ics2026-backend:${{ github.sha }} .

  # 3. Publicacion en Azure
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker

    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Publicar API
        run: dotnet publish Dsw2025Tpi.Api/Dsw2025Tpi.Api.csproj --configuration Release --output ./publish

      - name: Iniciar sesion en Azure
        uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en Azure Web App
        uses: azure/webapps-deploy@84a80cfe7e9889f35148ed88c307e6e93bf02578
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
